apiVersion: v1
kind: Service
metadata:
  name: osv-service
  labels:
    app.kubernetes.io/name: osv-service
    app.kubernetes.io/part-of: sbom-researcher
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: osv-service
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
# Air-gapped deployment note:
# Point intranet DNS "api.osv.dev" at this Service so existing tools
# (incl. SBOM-Researcher) work unchanged against the local mirror.
# For external exposure add an Ingress/LoadBalancer referencing this Service.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: osv-service-data
  labels:
    app.kubernetes.io/name: osv-service
    app.kubernetes.io/part-of: sbom-researcher
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
