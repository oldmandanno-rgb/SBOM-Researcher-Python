worker_processes auto;
error_log /dev/stderr;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;

  # Writable temp paths (root filesystem is read-only in the pod).
  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path       /var/cache/nginx/proxy_temp;

  upstream osv_backend {
    server osv-service:8000;
  }

  server {
    # Non-privileged port so the container can run as a non-root user; the
    # Service maps external 443 -> targetPort 8443.
    listen 8443 ssl;
    server_name api.osv.dev;

    ssl_certificate     /tls/tls.crt;
    ssl_certificate_key /tls/tls.key;

    # OSV.dev clients may POST large SBOM/query bodies.
    client_max_body_size 50m;

    location / {
      proxy_pass http://osv_backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
