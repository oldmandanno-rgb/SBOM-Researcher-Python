apiVersion: apps/v1
kind: Deployment
metadata:
  name: osv-proxy
  labels:
    app.kubernetes.io/name: osv-proxy
    app.kubernetes.io/part-of: sbom-researcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: osv-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osv-proxy
        app.kubernetes.io/part-of: sbom-researcher
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # nginx:1.27-alpine @ sha256 — regenerate with:
          #   docker pull nginx:1.27-alpine && \
          #   docker inspect --format '{{index .RepoDigests 0}}' nginx:1.27-alpine
          image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        # osv-proxy-conf is generated from nginx.conf by the kustomization.
        - name: config
          configMap:
            name: osv-proxy-conf
        # osv-proxy-tls must exist before applying (create with your internal-CA
        # signed cert for api.osv.dev, or via scripts/local-proxy.sh locally):
        #   kubectl create secret tls osv-proxy-tls \
        #     --cert=api.osv.dev.crt --key=api.osv.dev.key
        - name: tls
          secret:
            secretName: osv-proxy-tls
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
