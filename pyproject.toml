[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbom-researcher"
version = "0.1.0"
description = "Cross-platform SBOM vulnerability analyzer (Python port of SBOM-Researcher)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "packaging>=23",
    "cyclonedx-python-lib>=9.0",
    "spdx-tools>=0.8",
    "cvss>=3.6",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.25",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "ruff==0.6.9",
    "mypy==1.13.0",
    "pre-commit==3.8.0",
    "typing_extensions==4.12.2",
    "atheris==3.0.0",
]

[project.scripts]
sbom-researcher = "sbom_researcher.cli:main"
osv-service = "osv_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "smoke: real-data smoke test that requires network access to api.osv.dev",
]