name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['python']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9ee088e13615f8d1eaef4766f9dde95d3356a8f6 # v3
        with:
          category: "/language:${{ matrix.language }}"

  dependabot:
    name: Dependabot Alerts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          

      - name: Install dependencies
        run: python -m pip install --require-hashes -r .github/requirements/pip-audit.txt

      - name: Run pip-audit
        run: pip-audit --desc || true

  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          

      - name: Install bandit
        run: python -m pip install --require-hashes -r .github/requirements/bandit.txt

      - name: Run bandit
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Upload bandit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 1

  trivy:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to Code Scanning
        uses: github/codeql-action/upload-sarif@9ee088e13615f8d1eaef4766f9dde95d3356a8f6 # v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload Trivy SARIF for badges
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 1

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          

      - name: Install Semgrep
        run: python -m pip install --require-hashes -r .github/requirements/semgrep.txt

      - name: Run Semgrep
        run: semgrep --config=p/security-audit --config=p/secrets --config=p/python --sarif --output=semgrep.sarif .

      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@9ee088e13615f8d1eaef4766f9dde95d3356a8f6 # v3
        with:
          sarif_file: semgrep.sarif

      - name: Upload Semgrep SARIF for badges
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-results
          path: semgrep.sarif
          retention-days: 1

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          publish_results: true

      - name: Upload Scorecard results
        uses: github/codeql-action/upload-sarif@9ee088e13615f8d1eaef4766f9dde95d3356a8f6 # v3
        with:
          sarif_file: results.sarif

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: python -m pip install --require-hashes -r .github/requirements/dev.txt

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest tests/ -v -m "not smoke" --cov=src --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ./junit.xml

  fuzzing:
    name: Fuzzing (ClusterFuzzLite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
          bad-build-check: 'false'

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          fuzz-seconds: 120  # 2 minutes per fuzzer on full runs
          dry-run: ${{ github.event_name == 'pull_request' }}

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzzing-crashes
          path: |
            ./crashes/
            ./fuzzer-output/
          if-no-files-found: ignore
          retention-days: 30

  badges:
    name: Generate Security Badges
    needs: [bandit, trivy, semgrep, fuzzing]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Bandit report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bandit-report
          path: artifacts

      - name: Download Trivy results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-results
          path: artifacts
        continue-on-error: true

      - name: Download Semgrep results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: semgrep-results
          path: artifacts
        continue-on-error: true

      - name: Generate badge JSON
        run: |
          python << 'EOF'
          import json
          import os
          import glob

          def semgrep_badge():
              # Semgrep: green if 0 findings or only INFO, yellow if WARNING, red if ERROR
              sarif_files = glob.glob('artifacts/semgrep*.sarif')
              if not sarif_files:
                  return {"schemaVersion": 1, "label": "Semgrep", "message": "no data", "color": "lightgrey"}
              with open(sarif_files[0]) as f:
                  data = json.load(f)
              runs = data.get('runs', [])
              findings = []
              for run in runs:
                  for result in run.get('results', []):
                      level = result.get('level', 'none')
                      findings.append(level)
              has_error = 'error' in findings
              has_warning = 'warning' in findings
              total = len(findings)
              if has_error:
                  return {"schemaVersion": 1, "label": "Semgrep", "message": f"{total} findings", "color": "red"}
              elif has_warning:
                  return {"schemaVersion": 1, "label": "Semgrep", "message": f"{total} findings", "color": "yellow"}
              else:
                  return {"schemaVersion": 1, "label": "Semgrep", "message": f"{total} findings", "color": "brightgreen"}

          def bandit_badge():
              # Bandit: green if 0 or only LOW, yellow if MEDIUM, red if HIGH
              json_files = glob.glob('artifacts/bandit-report*.json')
              if not json_files:
                  return {"schemaVersion": 1, "label": "Bandit", "message": "no data", "color": "lightgrey"}
              with open(json_files[0]) as f:
                  data = json.load(f)
              results = data.get('results', [])
              severities = [r.get('issue_severity', '').upper() for r in results]
              has_high = 'HIGH' in severities
              has_medium = 'MEDIUM' in severities
              total = len(results)
              if has_high:
                  return {"schemaVersion": 1, "label": "Bandit", "message": f"{total} issues", "color": "red"}
              elif has_medium:
                  return {"schemaVersion": 1, "label": "Bandit", "message": f"{total} issues", "color": "yellow"}
              else:
                  return {"schemaVersion": 1, "label": "Bandit", "message": f"{total} issues", "color": "brightgreen"}

          def trivy_badge():
              # Trivy: green if 0 or only LOW, yellow if MEDIUM, red if HIGH/CRITICAL
              sarif_files = glob.glob('artifacts/trivy*.sarif')
              if not sarif_files:
                  return {"schemaVersion": 1, "label": "Trivy", "message": "no data", "color": "lightgrey"}
              with open(sarif_files[0]) as f:
                  data = json.load(f)
              runs = data.get('runs', [])
              severities = []
              for run in runs:
                  for result in run.get('results', []):
                      props = result.get('properties', {})
                      severity = props.get('severity', '').upper()
                      if severity:
                          severities.append(severity)
              has_critical = 'CRITICAL' in severities
              has_high = 'HIGH' in severities
              has_medium = 'MEDIUM' in severities
              total = len(severities)
              if has_critical or has_high:
                  return {"schemaVersion": 1, "label": "Trivy", "message": f"{total} vulns", "color": "red"}
              elif has_medium:
                  return {"schemaVersion": 1, "label": "Trivy", "message": f"{total} vulns", "color": "yellow"}
              else:
                  return {"schemaVersion": 1, "label": "Trivy", "message": f"{total} vulns", "color": "brightgreen"}

          os.makedirs('badges', exist_ok=True)
          with open('badges/semgrep.json', 'w') as f:
              json.dump(semgrep_badge(), f)
          with open('badges/bandit.json', 'w') as f:
              json.dump(bandit_badge(), f)
          with open('badges/trivy.json', 'w') as f:
              json.dump(trivy_badge(), f)
          print("Generated badges:")
          for name in ['semgrep', 'bandit', 'trivy']:
              with open(f'badges/{name}.json') as f:
                  print(f"  {name}: {json.load(f)}")
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges
          destination_dir: .
          keep_files: true
          force_orphan: true