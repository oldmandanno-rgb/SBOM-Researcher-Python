name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['python']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b91868199f269d217d84e4e2d0f853f6c85c8c8d # v3.28.1
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7d060e5a5e7b2a5c8f5c4a3e7e8f9d0b1c2d3e4f5 # v3.28.1
        with:
          category: "/language:${{ matrix.language }}"

  dependabot:
    name: Dependabot Alerts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87060 # v5.4.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --desc || true

  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87060 # v5.4.0
        with:
          python-version: '3.10'

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Upload bandit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e9274886f134073677 # v4.4.3
        with:
          name: bandit-report
          path: bandit-report.json

  trivy:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0b65c2e3c4a1d5e9f8b7c6a5d4e3f2a1b0c9d8e7f6 # v0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to Code Scanning
        uses: github/codeql-action/upload-sarif@7d060e5a5e7b2a5c8f5c4a3e7e8f9d0b1c2d3e4f5 # v3.28.1
        with:
          sarif_file: 'trivy-results.sarif'

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep
        uses: returntocorp/semgrep@5d8e9f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8 # v1.173.0
        with:
          config: >-
            p/security-audit
            p/secrets
            p/python
          generateSarif: true

      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@7d060e5a5e7b2a5c8f5c4a3e7e8f9d0b1c2d3e4f5 # v3.28.1
        with:
          sarif_file: semgrep.sarif

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          publish_results: true
          exclude: Branch-Protection

      - name: Upload Scorecard results
        uses: github/codeql-action/upload-sarif@7d060e5a5e7b2a5c8f5c4a3e7e8f9d0b1c2d3e4f5 # v3.28.1
        with:
          sarif_file: results.sarif

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87060 # v5.4.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -e .[dev]

      - name: Run tests
        run: pytest tests/ -v --cov=src/sbom_researcher --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@1a9e856d7c4f3e2b1a0c9d8e7f6a5b4c3d2e1f0a # v4.6.0
        with:
          files: ./coverage.xml